<!DOCTYPE html>
<html>
<head>
    <title>SQL Completion Test</title>
    <style>
        #editor {
            width: 800px;
            height: 400px;
            border: 1px solid #ccc;
        }
        #context-log {
            width: 800px;
            height: 200px;
            border: 1px solid #ccc;
            overflow: auto;
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h2>SQL Completion Context Test</h2>
    <div id="editor"></div>
    <div id="context-log"></div>
    
    <script type="module">
        import * as monaco from 'monaco-editor';
        import './src/languages/index.js';
        
        const editor = monaco.editor.create(document.getElementById('editor'), {
            value: 'SELECT * FROM users WHERE ',
            language: 'mysql',
            theme: 'vs-dark',
            automaticLayout: true,
            minimap: { enabled: false },
            suggest: {
                snippetsPreventQuickSuggestions: false
            }
        });
        
        // Override completion provider to log contexts
        const originalCompletionService = window.completionService;
        
        // Listen for completion events
        editor.onDidType(() => {
            const position = editor.getPosition();
            const model = editor.getModel();
            
            // Trigger completion to see what contexts we get
            monaco.editor.getSuggestController(editor)?.triggerSuggest();
        });
        
        // Log any console messages
        const logDiv = document.getElementById('context-log');
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const msg = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg
            ).join(' ');
            logDiv.innerHTML += msg + '<br>';
            logDiv.scrollTop = logDiv.scrollHeight;
        };
    </script>
</body>
</html>
